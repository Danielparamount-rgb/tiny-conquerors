name: relay-warm

# The relay runs on Render's free tier, which puts the service to sleep after
# ~15 idle minutes and takes most of a minute to wake. A ping every ten
# minutes keeps it warm, so Host a Table answers at once.
# (GitHub pauses scheduled workflows after 60 days without repository
# activity — a push re-enables it.)

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the relay
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 60 https://tiny-conquerors-relay.onrender.com/healthz; then exit 0; fi
            sleep 20
          done
          echo "relay did not answer" >&2
          exit 1

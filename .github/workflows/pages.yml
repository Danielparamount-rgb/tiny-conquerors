# Publishes app/ to the gh-pages branch on every push to main. On a public
# repo, GitHub enables Pages automatically the first time gh-pages appears:
#   Tiny Conquerors at /tiny-conquerors/, Stock Market 1968 at /tiny-conquerors/market/
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish app/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./app
          force_orphan: true
          commit_message: 'deploy: publish app/ from'
